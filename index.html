<style>
/* Layout: una colonna da telefono. Barra fissa con tre schede, sotto la scheda attiva. Settimana = striscia dei giorni + card di cucina + pasti a righe. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #16231F;
  --ink-2: #4B5B55;
  --line: #D9DFDA;
  --accent: #2B4FD8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FC;
  --ok: #1E7A4C;
  --ok-soft: #DDF0E5;
  --warn: #8F5208;
  --warn-soft: #F8E8CE;
  --bad: #B3321F;
  --bad-soft: #F7DDD8;
  --plate: #EDEFEA;
  --plate-rim: #CBD2CC;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101714;
    --surface: #18221E;
    --ink: #E8EFEA;
    --ink-2: #9AAAA3;
    --line: #2A3832;
    --accent: #8CA3FF;
    --accent-ink: #0C1330;
    --accent-soft: #1E2850;
    --ok: #6CCB97;
    --ok-soft: #173326;
    --warn: #E6AE5C;
    --warn-soft: #3A2B12;
    --bad: #F29080;
    --bad-soft: #3E1D17;
    --plate: #26332D;
    --plate-rim: #3A4A42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101714;
  --surface: #18221E;
  --ink: #E8EFEA;
  --ink-2: #9AAAA3;
  --line: #2A3832;
  --accent: #8CA3FF;
  --accent-ink: #0C1330;
  --accent-soft: #1E2850;
  --ok: #6CCB97;
  --ok-soft: #173326;
  --warn: #E6AE5C;
  --warn-soft: #3A2B12;
  --bad: #F29080;
  --bad-soft: #3E1D17;
  --plate: #26332D;
  --plate-rim: #3A4A42;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }

/* intestazione e schede */
.top { padding-top: 18px; }
.top h1 { font-size: 30px; line-height: 1.05; font-weight: 700; }
.top .sub { color: var(--ink-2); margin-top: 4px; }
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  margin-top: 14px;
  padding-block: 8px;
}
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tab {
  min-height: 42px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge {
  font-family: var(--f-mono);
  font-size: 11px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 999px;
  padding: 1px 7px;
}
main { padding-top: 16px; display: flex; flex-direction: column; gap: 18px; }

/* striscia dei giorni */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day {
  min-height: 58px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  font-weight: 600;
  padding: 4px 0;
}
.day small { font-family: var(--f-mono); font-size: 10px; font-weight: 400; color: var(--ink-2); }
.day i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.day i.cook { background: var(--accent); border-color: var(--accent); }
.day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8; }
.day[aria-pressed="true"] i { border-color: var(--accent-ink); }
.day[aria-pressed="true"] i.cook { background: var(--accent-ink); }

.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.dayhead h2 { font-size: 26px; font-weight: 700; }
.pill {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 9px;
  background: var(--accent-soft);
  color: var(--accent);
}
.pill.ink { background: var(--ink); color: var(--bg); }
.label {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* card di cucina */
.cook {
  background: var(--accent-soft);
  border-radius: 14px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.cook h3 { font-size: 20px; font-weight: 700; }
.cook .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cook .time { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.made { display: flex; flex-direction: column; gap: 8px; }
.madeitem { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.madeitem b { font-weight: 600; }
.madeitem span { color: var(--ink-2); display: block; font-size: 13px; }
ol.steps { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
ol.steps li { counter-increment: s; padding-left: 30px; position: relative; }
ol.steps li::before {
  content: counter(s);
  position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--bg);
  font-family: var(--f-mono); font-size: 11px;
  display: grid; place-items: center;
}
.ings { display: flex; flex-direction: column; background: var(--surface); border-radius: 10px; }
.ing { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.ing:first-child { border-top: 0; }
.q { font-family: var(--f-mono); font-size: 13px; }
.chip { font-family: var(--f-mono); font-size: 11px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.note a { color: inherit; font-weight: 600; }

/* pasti */
.meals { border-top: 1px solid var(--line); }
details.meal { border-bottom: 1px solid var(--line); }
details.meal > summary {
  list-style: none;
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto 14px;
  gap: 10px; align-items: center;
  min-height: 56px; padding: 8px 0;
  cursor: pointer;
}
details.meal > summary::-webkit-details-marker { display: none; }
details.meal > summary::after { content: "›"; font-size: 20px; color: var(--ink-2); transition: transform .15s; }
details.meal[open] > summary::after { transform: rotate(90deg); }
.meal .nm { font-weight: 600; }
.meal .from { display: block; color: var(--ink-2); font-size: 13px; font-weight: 400; }
.tag { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.tag.fresh { color: var(--ok); border-color: var(--ok); }
.done { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--ok); }
.recipe { padding: 4px 0 18px; display: flex; flex-direction: column; gap: 14px; }
.rhead { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.rmeta { display: flex; flex-direction: column; gap: 6px; }
.rmeta .t { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.recipe ul.list { list-style: none; display: flex; flex-direction: column; }
.recipe ul.list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.recipe ul.list li:first-child { border-top: 0; }
.tip { font-size: 14px; color: var(--ink-2); }
.photoact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.photoact label.btn { display: inline-flex; align-items: center; }
.photoact input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.art { width: var(--s, 52px); height: var(--s, 52px); flex: none; }
.art svg, .art img { width: 100%; height: 100%; display: block; }
.art img { object-fit: cover; border-radius: 50%; border: 2px solid var(--plate-rim); }

/* da conservare */
.store { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.store li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.store b { font-weight: 600; }
.store span { color: var(--ink-2); font-size: 14px; }
.nothing { color: var(--ink-2); padding: 4px 0; }

/* dispensa e spesa */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sum strong { font-family: var(--f-display); font-size: 20px; }
.bar2 { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar2 > i { display: block; height: 100%; background: var(--ok); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > .gh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pitem .nm { font-weight: 600; }
.pitem .meta { color: var(--ink-2); font-size: 13px; font-family: var(--f-mono); }
.pitem .track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pitem .track > i { display: block; height: 100%; }
.ctrl { display: flex; align-items: center; gap: 4px; }
.ctrl button.step { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.ctrl input { width: 68px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: center; font-family: var(--f-mono); font-size: 14px; }
.ctrl .pack { height: 36px; padding: 0 8px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.buyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.buyrow .nm { font-weight: 600; }
.buyrow .meta { color: var(--ink-2); font-size: 13px; }
.empty { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 16px; font-weight: 600; }
.foot { color: var(--ink-2); font-size: 12px; font-family: var(--f-mono); padding-top: 6px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20;
  max-width: calc(100vw - 32px);
}
@media (max-width: 420px) {
  details.meal > summary { grid-template-columns: 64px minmax(0, 1fr) 14px; }
  details.meal > summary .tag { display: none; }
  .rhead { grid-template-columns: 84px minmax(0, 1fr); }
  .ctrl .pack { display: none; }
  .ctrl input { width: 58px; }
}

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(function (res, rej) { c.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/jpeg", 0.82); });
}

    const res = await assetsNS.upload(blob, { type: blob.type === "image/jpeg" ? "image/jpeg" : blob.type });
    const p = {}; p[fid] = res.id;
    commit({ photos: p });

  } catch (e) {
    toast("Non riesco a caricare la foto");
  }
}
function removeItem(id) {

  const p = {}; p[id] = null;
  saveCfg({pantry:p});
}

  saveCfg();
}
function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

  },
  dayedit: function (t) { openDaySheet(t.dataset.k); },
  "welcome-x": function (t, e) { e.preventDefault(); lsSet("dp-welcome", "1"); render(); },
  "welcome-reset": function (t, e) { e.preventDefault(); ACT.reset(); },
  share: function () { openSheet({type:"share"}); },
  import: function () { openSheet({type:"import", draft:{code:""}}); },
  reset: function () { confirmSheet("Ricominciare da zero?", "Cancella ingredienti, piatti e settimana attuali e parte da un foglio bianco. Anche la dispensa viene svuotata.", "Cancella tutto", function () { const p = {}; Object.keys(state.pantry).forEach(function (k) { p[k] = null; }); ui.dish = null; setCfg(emptyCfg(), {pantry:p}); toast("Foglio bianco: aggiungi i tuoi piatti"); }, true); },
  restore: function () { confirmSheet("Ripristinare il menu di Rosario?", "Sostituisce piatti, ingredienti e settimana attuali con il menu di esempio.", "Ripristina", function () { ui.dish = null; setCfg(seedCfg()); toast("Menu di esempio ripristinato"); }, true); },
  /* fogli */
  sclose: function () { closeSheet(); },
  sok: function () { const s = curSheet(); closeSheet(); if (s && s.onOk) s.onOk(); },
  ssave: function () { const s = curSheet(); if (!s) return; if (SH[s.type].save(s) !== false) closeSheet(); },
  "st-add": function (t) { const s = curSheet(); s.draft[t.dataset.l].push(""); drawSheet(); const a = document.querySelectorAll('#sheet textarea[data-f="' + t.dataset.l + '"]'); if (a.length) a[a.length - 1].focus(); },
  "st-del": function (t) { const s = curSheet(); s.draft[t.dataset.l].splice(+t.dataset.i, 1); drawSheet(); },
  "st-up": function (t) { const s = curSheet(); moveIn(s.draft[t.dataset.l], +t.dataset.i, -1); drawSheet(); },
  "st-dn": function (t) { const s = curSheet(); moveIn(s.draft[t.dataset.l], +t.dataset.i, 1); drawSheet(); },
  "ing-del": function (t) { const s = curSheet(); s.draft.ing.splice(+t.dataset.i, 1); drawSheet(); },
  reroll: function () { const s = curSheet(); s.draft.seed = (s.draft.seed || 0) + 1; refreshPreview(s); },
  saveasnew: function () { const s = curSheet(); if (SH.dish.save(s, true) !== false) closeSheet(); },
  "dish-del": function () {
    const s = curSheet(), f = FOODS[s.id], n = dishUsage(s.id);
    confirmSheet("Eliminare il piatto?", "«" + f.n + "» sparisce dal ricettario" + (n ? " e dai " + n + " pasti della settimana in cui compare" : "") + ".", "Elimina", function () { closeSheet(); removeDish(s.id); toast("Piatto eliminato"); }, true);
  },
  "item-del": function () {
    const s = curSheet(), it = IT[s.id];
    const used = Object.keys(FOODS).filter(function (id) { return FOODS[id].ing.some(function (p) { return p[0] === it.id; }); });
    confirmSheet("Sicuro di eliminare «" + it.n + "» dalla dispensa?", used.length ? "Verrà tolto anche dalle ricette che lo usano: " + used.map(function (id) { return FOODS[id].n; }).join(", ") + "." : "Sparisce da dispensa e spesa.", "Elimina", function () { closeSheet(); removeItem(it.id); toast("Eliminato"); }, true);
  },
  "entry-del": function () {
    const s = curSheet(), r = findEntry(s.id);
    confirmSheet("Togliere il pasto?", "«" + FOODS[r.e.f].n + "» sparisce da " + FULL[r.day] + ".", "Togli", function () { closeSheet(); PLAN[r.day].splice(PLAN[r.day].indexOf(r.e), 1); saveCfg(); toast("Tolto"); }, true);
  },
  "day-swap": function () {
    const s = curSheet(); if (!s.draft.swap) { toast("Scegli con quale giorno scambiare"); return; }
    const a = s.k, b = s.draft.swap;
    closeSheet(); swapDays(a, b); go("settimana", b); toast(FULL[a] + " e " + FULL[b] + " scambiati");
  },
  "day-clear": function () {
    const s = curSheet(), k = s.k;
    confirmSheet("Svuotare " + FULL[k] + "?", "Tutti i pasti e le note di questo giorno vengono tolti. I piatti restano nel ricettario.", "Svuota", function () { closeSheet(); PLAN[k] = []; DAYM[k] = {time:0, order:[], note:null}; ui.dish = null; saveCfg(); toast("Giorno svuotato"); }, true);

  "copy-share": function () { const b = document.getElementById("sharebox"); copyText(b ? b.value : shareCode(), "Codice copiato"); }
};
function refreshPreview(s) {
  const el = document.getElementById("aprev"), old = s.id ? FOODS[s.id] : null;
  if (el) el.innerHTML = artOf(old && old.art && !s.draft.seed ? old : draftFood(s.draft), s.id || "preview", 76);
}

document.addEventListener("toggle", function (e) {
  const d = e.target;
  if (d && d.classList && (d.classList.contains("meal") || d.classList.contains("rec"))) ui.open[d.dataset.key] = d.open;
}, true);

document.addEventListener("click", function (e) {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const f = ACT[t.dataset.a];
  if (f) f(t, e);
});

function setField(t) {
  const s = curSheet();
  if (!s || !s.draft || t.closest("#sheet") === null) return false;
  const d = s.draft, f = t.dataset.f;
  if (t.dataset.i !== undefined) { const i = +t.dataset.i; if (f === "ing") d.ing[i][t.dataset.k] = t.value; else d[f][i] = t.value; }
  else if (t.type === "checkbox") d[f] = t.checked;
  else d[f] = t.value;
  return true;
}
function onSheetField(e) {
  const t = e.target;
  if (!t || !t.dataset || !t.dataset.f) return false;
  const s = curSheet();
  if (!s || t.closest("#sheet") === null) return false;
  if (t.dataset.f === "ingadd") {
    if (e.type !== "change" || !t.value) return true;
    if (t.value === "__new__") { t.value = ""; openItemSheet("recipe", {onDone: function (it) { s.draft.ing.push({id:it.id, q:""}); }}); }
    else { s.draft.ing.push({id:t.value, q:""}); drawSheet(); }
    return true;
  }
  if (s.type === "entry" && t.dataset.f === "f" && t.value === "__new__") {
    openDishSheet(null, {onDone: function (fid) { s.draft.f = fid; }});
    return true;
  }
  setField(t);
  if (t.dataset.f === "emo") s.draft.emoT = true;
  if (s.type === "item" && t.dataset.f === "cat") s.draft.catT = true;
  if (s.type === "item" && t.dataset.f === "where") s.draft.whereT = true;
  clearErr(s, t);
  if (SH[s.type].sync) SH[s.type].sync(s);
  if (s.type === "dish" && t.dataset.f === "yield" && t.value === "+") { const y = document.getElementById("y-n"); if (y) y.focus(); }
  if (s.type === "dish" && e.type === "change" && (t.dataset.f === "n")) refreshPreview(s);
  return true;
}
document.addEventListener("input", onSheetField);
document.addEventListener("change", function (e) {
  if (onSheetField(e)) return;
  const t = e.target;
  if (!t || !t.dataset) return;
  if (t.id === "emoin" && t.value.trim()) { IC.e = t.value.trim(); applyIcon(true); }
  else if (t.dataset.a === "stp") { const v = Number(String(t.value).replace(",", ".")); if (v > 0) { STEPS[t.dataset.i] = v; lsSet("dp-steps", JSON.stringify(STEPS)); } render(); }
  else if (t.dataset.a === "set") setHave(t.dataset.i, t.value === "" ? 0 : t.value);
  else if (t.dataset.a === "photo") addPhoto(t.dataset.f, t.files && t.files[0]);
});

/* ---------- icona ---------- */
const EMO = ["🍝","🍚","🥘","🍳","🥕","🍅","🥑","🍕","🍲","🥗","🌶️","🧅"], COLS = ["C4492F","3E8E5F","2F78B5","E8A317","8E5BA8","2B2017"];
const IC = { e: "🍝", c: "C4492F" };
try { const p = new URLSearchParams(location.search), l = JSON.parse(lsGet("dp-icon") || "null"); if (l) { IC.e = l.e; IC.c = l.c; } if (p.get("i")) IC.e = p.get("i"); if (p.get("c")) IC.c = p.get("c"); } catch (e) {}
function applyIcon(save) {
  const cv = document.createElement("canvas"); cv.width = cv.height = 180;
  const x = cv.getContext("2d"); x.fillStyle = "#" + IC.c; x.fillRect(0, 0, 180, 180);
  x.font = '110px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(IC.e, 90, 98);
  let l = document.querySelector('link[rel="apple-touch-icon"]');
  if (!l) { l = document.createElement("link"); l.rel = "apple-touch-icon"; document.head.appendChild(l); }
  l.href = cv.toDataURL("image/png");
  if (save) { lsSet("dp-icon", JSON.stringify(IC)); try { history.replaceState(null, "", "?i=" + encodeURIComponent(IC.e) + "&c=" + IC.c + location.hash); } catch (e) {} toast("Icona pronta: ora aggiungi l'app alla Home da Safari"); }
  document.getElementById("emo").innerHTML = EMO.map(function (e) { return '<button class="fchip" data-a="iemoji" data-v="' + e + '" aria-pressed="' + (e === IC.e) + '">' + e + "</button>"; }).join("");
  document.getElementById("col").innerHTML = COLS.map(function (c) { return '<button class="fchip" data-a="icolor" data-v="' + c + '" aria-pressed="' + (c === IC.c) + '" aria-label="Colore" style="background:#' + c + ';width:44px"></button>'; }).join("");
}
applyIcon(false);

/* ---------- swipe tra le schede ---------- */
const TABS = ["settimana","dispensa","spesa"];
function place(drag) {
  const t = document.getElementById("rail");
  t.style.transition = drag === undefined ? "transform .3s ease" : "none";
  t.style.transform = "translateX(calc(" + (-TABS.indexOf(ui.tab) * 100 / 3) + "% - " + (TABS.indexOf(ui.tab) * 8) + "px + " + (drag || 0) + "px))";
}
(function () {
  const pg = document.getElementById("pager"); let x0 = 0, y0 = 0, dx = 0, mode = null;
  pg.addEventListener("touchstart", function (e) { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; mode = null; }, { passive: true });
  pg.addEventListener("touchmove", function (e) {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!mode) { if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) mode = "h"; else if (Math.abs(my) > 10) mode = "v"; }
    if (mode !== "h") return;
    const i = TABS.indexOf(ui.tab); dx = mx;
    if ((i === 0 && dx > 0) || (i === 2 && dx < 0)) dx *= 0.3;
    place(dx);
  }, { passive: true });
  pg.addEventListener("touchend", function () {
    if (mode !== "h") return;
    const i = TABS.indexOf(ui.tab), w = pg.clientWidth; let n = i;
    if (dx < -w * 0.2) n = i + 1; else if (dx > w * 0.2) n = i - 1;
    n = Math.max(0, Math.min(2, n)); mode = null;
    if (n !== i) { go(TABS[n]); window.scrollTo(0, 0); } else place();
  });
})();

/* ---------- avvio ---------- */
const local = loadLocal();
if (local) { state = local; Persist.mode = "local"; }
CFG = cfgFromState(); rebuild();
applyHash();
ui.day = todayKey();
try { if (KEYS.indexOf((location.hash || "").replace("#", "")) >= 0) location.hash = ui.day; } catch (e) {}
render();

(async function connect() {
  if (!(window.claude && window.claude.use)) { if (Persist.mode === "pending") { Persist.mode = saveLocal() ? "local" : "memory"; renderFoot(); } return; }
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { if (Persist.mode === "pending") { Persist.mode = saveLocal() ? "local" : "memory"; } renderFoot(); return; }
  try { assetsNS = await window.claude.use("assets"); } catch (e) { assetsNS = null; }
  Persist.ref = db.doc("app/state");
  Persist.mode = "db";
  Persist.ref.onSnapshot(function (snap) {
    Persist.exists = snap.exists;
    if (Persist.patch || Persist.busy || snap.metadata.hasPendingWrites) { renderFoot(); return; }
    if (snap.exists) { state = normalize(snap.data()); saveLocal(); CFG = cfgFromState(); rebuild(); render(); }
    else if (local && (Object.keys(local.pantry).length || Object.keys(local.cooked).length || Object.keys(local.cfg).length)) {
      Persist.queue({ pantry: local.pantry, cooked: local.cooked, photos: local.photos, cfg: local.cfg });
      renderFoot();
    } else { render(); }
  }, function () { Persist.mode = local ? "local" : "memory"; renderFoot(); });
})();
})();
