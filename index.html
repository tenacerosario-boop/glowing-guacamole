<style>
/* Layout: una colonna da telefono. Barra fissa con tre schede, sotto la scheda attiva. Settimana = striscia dei giorni + card di cucina + pasti a righe. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #16231F;
  --ink-2: #4B5B55;
  --line: #D9DFDA;
  --accent: #2B4FD8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FC;
  --ok: #1E7A4C;
  --ok-soft: #DDF0E5;
  --warn: #8F5208;
  --warn-soft: #F8E8CE;
  --bad: #B3321F;
  --bad-soft: #F7DDD8;
  --plate: #EDEFEA;
  --plate-rim: #CBD2CC;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101714;
    --surface: #18221E;
    --ink: #E8EFEA;
    --ink-2: #9AAAA3;
    --line: #2A3832;
    --accent: #8CA3FF;
    --accent-ink: #0C1330;
    --accent-soft: #1E2850;
    --ok: #6CCB97;
    --ok-soft: #173326;
    --warn: #E6AE5C;
    --warn-soft: #3A2B12;
    --bad: #F29080;
    --bad-soft: #3E1D17;
    --plate: #26332D;
    --plate-rim: #3A4A42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101714;
  --surface: #18221E;
  --ink: #E8EFEA;
  --ink-2: #9AAAA3;
  --line: #2A3832;
  --accent: #8CA3FF;
  --accent-ink: #0C1330;
  --accent-soft: #1E2850;
  --ok: #6CCB97;
  --ok-soft: #173326;
  --warn: #E6AE5C;
  --warn-soft: #3A2B12;
  --bad: #F29080;
  --bad-soft: #3E1D17;
  --plate: #26332D;
  --plate-rim: #3A4A42;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }

/* intestazione e schede */
.top { padding-top: 18px; }
.top h1 { font-size: 30px; line-height: 1.05; font-weight: 700; }
.top .sub { color: var(--ink-2); margin-top: 4px; }
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  margin-top: 14px;
  padding-block: 8px;
}
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tab {
  min-height: 42px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge {
  font-family: var(--f-mono);
  font-size: 11px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 999px;
  padding: 1px 7px;
}
main { padding-top: 16px; display: flex; flex-direction: column; gap: 18px; }

/* striscia dei giorni */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day {
  min-height: 58px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  font-weight: 600;
  padding: 4px 0;
}
.day small { font-family: var(--f-mono); font-size: 10px; font-weight: 400; color: var(--ink-2); }
.day i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.day i.cook { background: var(--accent); border-color: var(--accent); }
.day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8; }
.day[aria-pressed="true"] i { border-color: var(--accent-ink); }
.day[aria-pressed="true"] i.cook { background: var(--accent-ink); }

.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.dayhead h2 { font-size: 26px; font-weight: 700; }
.pill {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 9px;
  background: var(--accent-soft);
  color: var(--accent);
}
.pill.ink { background: var(--ink); color: var(--bg); }
.label {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* card di cucina */
.cook {
  background: var(--accent-soft);
  border-radius: 14px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.cook h3 { font-size: 20px; font-weight: 700; }
.cook .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cook .time { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.made { display: flex; flex-direction: column; gap: 8px; }
.madeitem { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.madeitem b { font-weight: 600; }
.madeitem span { color: var(--ink-2); display: block; font-size: 13px; }
ol.steps { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
ol.steps li { counter-increment: s; padding-left: 30px; position: relative; }
ol.steps li::before {
  content: counter(s);
  position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--bg);
  font-family: var(--f-mono); font-size: 11px;
  display: grid; place-items: center;
}
.ings { display: flex; flex-direction: column; background: var(--surface); border-radius: 10px; }
.ing { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.ing:first-child { border-top: 0; }
.q { font-family: var(--f-mono); font-size: 13px; }
.chip { font-family: var(--f-mono); font-size: 11px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.note a { color: inherit; font-weight: 600; }

/* pasti */
.meals { border-top: 1px solid var(--line); }
details.meal { border-bottom: 1px solid var(--line); }
details.meal > summary {
  list-style: none;
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto 14px;
  gap: 10px; align-items: center;
  min-height: 56px; padding: 8px 0;
  cursor: pointer;
}
details.meal > summary::-webkit-details-marker { display: none; }
details.meal > summary::after { content: "›"; font-size: 20px; color: var(--ink-2); transition: transform .15s; }
details.meal[open] > summary::after { transform: rotate(90deg); }
.meal .nm { font-weight: 600; }
.meal .from { display: block; color: var(--ink-2); font-size: 13px; font-weight: 400; }
.tag { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.tag.fresh { color: var(--ok); border-color: var(--ok); }
.recipe { padding: 4px 0 18px; display: flex; flex-direction: column; gap: 14px; }
.rhead { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.rmeta { display: flex; flex-direction: column; gap: 6px; }
.rmeta .t { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.recipe ul.list { list-style: none; display: flex; flex-direction: column; }
.recipe ul.list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.recipe ul.list li:first-child { border-top: 0; }
.tip { font-size: 14px; color: var(--ink-2); }
.photoact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.photoact label.btn { display: inline-flex; align-items: center; }
.photoact input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.art { width: var(--s, 52px); height: var(--s, 52px); flex: none; }
.art svg, .art img { width: 100%; height: 100%; display: block; }
.art img { object-fit: cover; border-radius: 50%; border: 2px solid var(--plate-rim); }

/* da conservare */
.store { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.store li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.store b { font-weight: 600; }
.store span { color: var(--ink-2); font-size: 14px; }
.nothing { color: var(--ink-2); padding: 4px 0; }

/* dispensa e spesa */
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sum strong { font-family: var(--f-display); font-size: 20px; }
.bar2 { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar2 > i { display: block; height: 100%; background: var(--ok); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > .gh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pitem .nm { font-weight: 600; }
.pitem .meta { color: var(--ink-2); font-size: 13px; font-family: var(--f-mono); }
.pitem .track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pitem .track > i { display: block; height: 100%; }
.ctrl { display: flex; align-items: center; gap: 4px; }
.ctrl button.step { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.ctrl input { width: 68px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: center; font-family: var(--f-mono); font-size: 14px; }
.ctrl .pack { height: 36px; padding: 0 8px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.buyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.buyrow .nm { font-weight: 600; }
.buyrow .meta { color: var(--ink-2); font-size: 13px; }
.empty { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 16px; font-weight: 600; }
.foot { color: var(--ink-2); font-size: 12px; font-family: var(--f-mono); padding-top: 6px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20;
  max-width: calc(100vw - 32px);
}
@media (max-width: 420px) {
  details.meal > summary { grid-template-columns: 64px minmax(0, 1fr) 14px; }
  details.meal > summary .tag { display: none; }
  .rhead { grid-template-columns: 84px minmax(0, 1fr); }
  .ctrl .pack { display: none; }
  .ctrl input { width: 58px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

function frac(q){const r=Math.round(q*4)/4;if(q>0&&r===0)return "meno di ¼";const w=Math.floor(r),f=r-w,t=f===.25?"¼":f===.5?"½":f===.75?"¾":"";return (w?w:"")+(w&&t?" ":"")+t||"0";}

  if (u === "g" && q >= 1000) return num(q / 1000) + " kg";

const LS_KEY = "doppia-porzione-v1";
let state = { pantry:{}, cooked:{}, photos:{} };

function normalize(d) {
  const s = { pantry:{}, cooked:{}, photos:{} };
  if (d && typeof d === "object") {
    ["pantry","cooked","photos"].forEach(function (sec) {
      if (d[sec] && typeof d[sec] === "object") {
        Object.keys(d[sec]).forEach(function (k) { s[sec][k] = d[sec][k]; });
      }
    });
  }
  return s;
}
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return null;
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
}

const Persist = {
  mode: "pending",   // pending | db | local | memory
  ref: null, exists: false, patch: null, busy: false, timer: null, error: false,
  status: function () {
    if (this.mode === "db") return this.error ? "Non riesco a salvare, riprovo" : "Salvato nel tuo account, anche su altri dispositivi";
    if (this.mode === "local") return "Salvato solo su questo dispositivo";
    if (this.mode === "memory") return "Non posso salvare in questa finestra: i dati restano finché non chiudi";
    return "";
  },
  queue: function (patch) {
    if (!this.patch) this.patch = {};
    Object.keys(patch).forEach(function (sec) {
      if (!Persist.patch[sec]) Persist.patch[sec] = {};
      Object.assign(Persist.patch[sec], patch[sec]);
    });
    if (this.mode === "db") {
      clearTimeout(this.timer);
      this.timer = setTimeout(function () { Persist.flush(); }, 500);
    } else {
      this.patch = null;
    }
  },
  flush: async function () {
    if (this.busy || !this.patch || !this.ref) return;
    this.busy = true;
    const p = this.patch;
    this.patch = null;
    try {
      if (this.exists) {
        try { await this.ref.update(p); }
        catch (e) { if (e && e.code === "invalid_argument") { await this.ref.set(JSON.parse(JSON.stringify(state))); } else { throw e; } }
      } else {
        await this.ref.set(JSON.parse(JSON.stringify(state)));
        this.exists = true;
      }
      this.error = false;
    } catch (e) {
      this.error = true;
      const q = this.patch || {};
      Object.keys(p).forEach(function (sec) { q[sec] = Object.assign({}, p[sec], q[sec] || {}); });
      this.patch = q;
      clearTimeout(this.timer);
      this.timer = setTimeout(function () { Persist.flush(); }, 5000);
    }
    this.busy = false;
    renderFoot();
    if (this.patch && !this.error) this.flush();
  }
};

function commit(patch) {
  Object.keys(patch).forEach(function (sec) {
    Object.keys(patch[sec]).forEach(function (k) { state[sec][k] = patch[sec][k]; });
  });
  const ok = saveLocal();
  if (Persist.mode === "pending" || Persist.mode === "local" || Persist.mode === "memory") {
    Persist.mode = ok ? "local" : "memory";
  }
  Persist.queue(patch);
  render();
}

/* ---------- logica ---------- */
function have(id) { return Number(state.pantry[id]) || 0; }
function missing(id) { return Math.max(0, Math.round((NEED[id] - have(id)) * 100) / 100); }
function buyQty(it) {
  const m = missing(it.id);
  if (m <= 0) return 0;
  return it.exact ? m : Math.round(Math.ceil(m / it.pack - 1e-9) * it.pack * 100) / 100;
}
function cookedInfo(k) {
  const raw = state.cooked[k];
  if (!raw) return null;
  try { const c = JSON.parse(raw); return c && c.w === WEEK ? c : null; } catch (e) { return null; }
}
function cookedKey(k, fid) { return cookedInfo(k + "_" + fid) ? k + "_" + fid : (cookedInfo(k) ? k : null); }
function sessionIngredients(day) {
  const agg = {};
  day.cook.forEach(function (fid) {
    FOODS[fid].ing.forEach(function (p) { agg[p[0]] = (agg[p[0]] || 0) + p[1]; });
  });
  return agg;
}
function markCooked(k, fid) {
  const agg = {}; FOODS[fid].ing.forEach(function (p) { agg[p[0]] = p[1]; });
  const used = {}, pantry = {};
  Object.keys(agg).forEach(function (id) {
    const take = Math.min(have(id), toU(id, agg[id]));
    used[id] = take;
    pantry[id] = Math.round((have(id) - take) * 100) / 100;
  });
  const cooked = {}; cooked[k + "_" + fid] = JSON.stringify({ w: WEEK, d: used });
  commit({ pantry: pantry, cooked: cooked });
  toast("Dispensa aggiornata");
}
function undoCooked(k) {
  const c = cookedInfo(k);
  const pantry = {};
  if (c) Object.keys(c.d).forEach(function (id) { pantry[id] = Math.round((have(id) + c.d[id]) * 100) / 100; });
  const cooked = {}; cooked[k] = null;
  commit({ pantry: pantry, cooked: cooked });
  toast("Ingredienti rimessi in dispensa");
}
function setHave(id, value) {
  const v = Math.max(0, Math.round(Number(value) * 100) / 100);
  if (!isFinite(v)) return;
  const p = {}; p[id] = v;
  commit({ pantry: p });
}
function missingCount() { return ITEMS.filter(function (x) { return missing(x.id) > 0; }).length; }

/* ---------- illustrazioni ---------- */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function plateSVG(id) {
  const f = FOODS[id], r = rng(hash(id)), art = f.art;
  let o = '<svg viewBox="0 0 120 120" role="img" aria-label="' + esc(f.n) + '">';
  o += '<circle cx="60" cy="60" r="57" fill="var(--plate)" stroke="var(--plate-rim)" stroke-width="2"/>';
  o += '<circle cx="60" cy="60" r="46" fill="none" stroke="var(--plate-rim)" stroke-width="1" opacity=".6"/>';
  if (art.bowl) o += '<circle cx="60" cy="60" r="38" fill="#F6F2E8" opacity=".9"/>';
  if (art.base) o += '<rect x="32" y="32" width="56" height="56" rx="9" fill="' + art.base + '"/>';
  const R = art.R || (art.bowl ? 30 : 36);
  art.items.forEach(function (it) {
    const shape = it[0], c = it[1], n = it[2], s = it[3];
    for (let i = 0; i < n; i++) {
      const ang = r() * 6.2832, d = Math.sqrt(r()) * R;
      const x = (60 + Math.cos(ang) * d).toFixed(1), y = (60 + Math.sin(ang) * d).toFixed(1);
      const rot = Math.round(r() * 180);
      const tr = ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"';
      if (shape === "dot") o += '<circle cx="' + x + '" cy="' + y + '" r="' + s + '" fill="' + c + '"/>';
      else if (shape === "cube") o += '<rect x="' + (x - s) + '" y="' + (y - s) + '" width="' + (s * 2) + '" height="' + (s * 2) + '" rx="1.5" fill="' + c + '"' + tr + '/>';
      else if (shape === "bar") o += '<rect x="' + (x - s / 2) + '" y="' + (y - s / 5) + '" width="' + s + '" height="' + (s * 0.4) + '" rx="' + (s * 0.2) + '" fill="' + c + '"' + tr + '/>';
      else if (shape === "leaf") o += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + s + '" ry="' + (s / 2) + '" fill="' + c + '"' + tr + '/>';
      else if (shape === "curl") o += '<path d="M' + (x - s) + ' ' + y + ' q' + (s / 2) + ' ' + (-s * 0.9) + ' ' + s + ' 0 t' + s + ' 0" fill="none" stroke="' + c + '" stroke-width="2.4" stroke-linecap="round"' + tr + '/>';
    }
  });
  return o + "</svg>";
}
function art(id, size) {
  const pid = state.photos[id];
  const inner = pid
    ? '<img src="/_blob/' + esc(pid) + '" alt="' + esc(FOODS[id].n) + '" loading="lazy">'
    : plateSVG(id);
  return '<div class="art" style="--s:' + size + 'px">' + inner + "</div>";
}

/* ---------- viste ---------- */
const ui = { tab: "settimana", day: todayKey(), filter: "tutti", open: {}, dish: null };

function ingredientRows(agg) {
  return Object.keys(agg).map(function (id) {
    const it = IT[id], q = toU(id, agg[id]), h = have(id);
    const chip = h >= q ? '<span class="chip ok">ce l\'hai</span>' : '<span class="chip ' + (h > 0 ? "warn" : "bad") + '">mancano ' + esc(fmt(q - h, it.u)) + "</span>";
    return '<div class="ing"><span>' + esc(it.n) + '</span><span class="q">' + esc(recFmt(id, agg[id])) + "</span>" + chip + "</div>";
  }).join("");
}

function recipe(fid, ctx) {
  const f = FOODS[fid];
  let h = '<div class="recipe"><div class="rhead"><div class="rmeta">';
  if (f.kind === "piatto") h += '<span class="t">' + (f.yield === 2 ? "Dose doppia: 2 pasti" : "1 pasto") + " · circa " + f.time + " min</span>";
  else h += '<span class="t">circa ' + f.time + " min</span>";
  if (f.tip) h += '<p class="tip">' + esc(f.tip) + "</p>";
  h += "</div></div>";
  h += '<div><div class="label" style="margin-bottom:4px">' + (f.yield === 2 ? "Ingredienti per tutta la cottura" : "Ingredienti") + '</div><ul class="list">';
  if (f.ing) {
    f.ing.forEach(function (p) { h += "<li><span>" + esc(IT[p[0]].n) + '</span><span class="q">' + esc(recFmt(p[0], p[1])) + "</span></li>"; });
  } else {
    f.ingText.forEach(function (t) { h += "<li><span>" + esc(t) + "</span></li>"; });
  }
  h += "</ul></div>";
  if (f.steps.length) {
    h += '<div><div class="label" style="margin-bottom:6px">Come si fa</div><ol class="steps">';
    f.steps.forEach(function (s) { h += "<li>" + esc(s) + "</li>"; });
    h += "</ol></div>";
  }
  if (f.kind === "piatto" && assetsNS && Persist.mode === "db") {
    h += '<div class="photoact"><label class="btn ghost small" for="ph-' + ctx + '">' + (state.photos[fid] ? "Cambia la tua foto" : "Aggiungi la tua foto") + '</label><input type="file" accept="image/*" id="ph-' + ctx + '" data-a="photo" data-f="' + fid + '">';
    if (state.photos[fid]) h += '<button class="btn ghost small" data-a="unphoto" data-f="' + fid + '">Usa l\'illustrazione</button>';
    h += "</div>";
  }
  return h + "</div>";
}

function dishView(k, fid) {
  const f = FOODS[fid], agg = {}, dn = cookedKey(k, fid);
  f.ing.forEach(function (p) { agg[p[0]] = p[1]; });
  const miss = Object.keys(agg).filter(function (id) { return have(id) < toU(id, agg[id]); }).length;
  let h = '<button class="btn ghost small" data-a="back">‹ Le ricette di oggi</button><div class="row1"><h3>' + esc(f.n) + '</h3><span class="time">circa ' + f.time + ' min</span></div>';
  h += '<div class="ings">' + ingredientRows(agg) + "</div>";
  h += '<ol class="steps">' + f.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>";
  if (f.tip) h += '<p class="tip">' + esc(f.tip) + "</p>";
  if (!dn && miss > 0) h += '<div class="note">Mancano ' + miss + ' ingredienti. <a href="#spesa" data-a="tab" data-t="spesa">Apri la spesa</a></div>';
  h += dn ? '<div class="row1"><span class="chip ok">Cucinato: dispensa aggiornata</span><button class="btn ghost small" data-a="undo" data-key="' + dn + '">Annulla</button></div>' : '<button class="btn" data-a="cooked" data-k="' + k + '" data-f="' + fid + '">Ho cucinato: togli dalla dispensa</button>';
  return h;
}
function viewDay(k) {
  const d = DAYS.find(function (x) { return x.k === k; });
  const isToday = k === todayKey();
  let h = '<div class="dayhead"><h2>' + FULL[k] + "</h2>";
  if (isToday) h += '<span class="pill">Oggi</span>';
  h += d.cook.length ? '<span class="pill ink">Giorno di cucina</span>' : '<span class="pill ink">Niente fornelli</span>';
  h += "</div>";

  if (d.cook.length) {
    h += '<section class="cook" aria-label="Cucina">';
    if (ui.dish && d.cook.indexOf(ui.dish) >= 0) h += dishView(k, ui.dish);
    else {
      h += '<div class="row1"><h3>' + (isToday ? "Oggi cucini" : "Qui cucini") + '</h3><span class="time">circa ' + d.time + ' min</span></div><p class="tip">Scegli cosa preparare:</p><div class="made">';
      d.cook.forEach(function (fid) {
        const f = FOODS[fid], dn = cookedKey(k, fid);
        h += '<button class="madeitem btn ghost" data-a="dish" data-f="' + fid + '">' + art(fid, 52) + "<div><b>" + esc(f.n) + (f.yield === 2 ? " ×2" : "") + "</b><span>" + esc(f.uses) + "</span></div>" + (dn ? '<span class="chip ok">fatto</span>' : "<span>›</span>") + "</button>";
      });
      h += '</div><details><summary class="label">Ordine di lavoro</summary><ol class="steps" style="margin-top:8px">' + d.order.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></details>";
    }
    h += "</section>";
  } else {
    h += '<p class="nothing">Oggi non cucini: scaldi quello che hai conservato.</p>';
  }

  if (d.extra) {
    h += '<section class="note"><b>' + esc(d.extra.t) + ".</b> " + esc(d.extra.b) + ' <a href="#' + d.extra.tab + '" data-a="tab" data-t="' + d.extra.tab + '">' + esc(d.extra.cta) + "</a></section>";
  }

  h += '<section><div class="label" style="margin-bottom:6px">Pasti</div><div class="meals">';
  ["col","pr","ce","sp"].forEach(function (m) {
    const meal = d.meals[m], f = FOODS[meal.f], key = k + "-" + m;
    const isOpen = ui.open[key] ? " open" : "";
    const tag = meal.from ? '<span class="tag">dal frigo</span>' : (f.kind === "piatto" ? '<span class="tag fresh">appena fatto</span>' : "");
    h += '<details class="meal" data-key="' + key + '"' + isOpen + '><summary><span class="label">' + MEAL_LABEL[m] + '</span><span class="nm">' + esc(f.n) +
      (meal.from ? '<span class="from">Cucinato ' + FULL[meal.from].toLowerCase() + ": scalda 2 minuti</span>" : "") + "</span>" + tag + "</summary>" +
      recipe(meal.f, key) + "</details>";
  });
  h += "</div></section>";

  h += '<section><div class="label" style="margin-bottom:6px">Da conservare</div>';
  if (d.store.length) {
    h += '<ul class="store">';
    d.store.forEach(function (s) { h += "<li><b>" + esc(s.t) + "</b><span>" + esc(s.how) + " · " + esc(s.until) + "</span></li>"; });
    h += "</ul>";
  } else {
    h += '<p class="nothing">' + (d.cook.length ? "Si mangia tutto oggi, niente da mettere via." : "Niente da conservare oggi.") + "</p>";
  }
  h += "</section>";
  return h;
}

function viewWeek() {
  let h = '<div class="days" role="group" aria-label="Giorni">';
  const t = todayKey();
  KEYS.forEach(function (k) {
    const cook = DAYS.find(function (x) { return x.k === k; }).cook.length > 0;
    h += '<button class="day' + (k === t ? " today" : "") + '" data-a="day" data-k="' + k + '" aria-pressed="' + (ui.day === k) + '"><span>' + SHORT[k] + "</span><i" + (cook ? ' class="cook"' : "") + '></i></button>';
  });
  h += '</div><p class="label">Il pallino pieno è un giorno di cucina</p>';
  return h + viewDay(ui.day);
}

function pitem(it) {
  const h = have(it.id), n = NEED[it.id], r = n > 0 ? h / n : 1, m = missing(it.id);
  const st = h <= 0 ? ["finito","bad"] : r < 0.5 ? ["poco","bad"] : r < 1 ? ["quasi finito","warn"] : ["ok","ok"];
  return '<div class="pitem' + (st[1] === "bad" ? " low" : "") + '"><div class="top2"><div class="nm">' + esc(it.n) + '</div><span class="chip ' + st[1] + '">' + st[0] + "</span></div>" +
    '<div class="meta">Hai ' + esc(fmt(h, it.u)) + " · a settimana ne usi " + esc(fmt(n, it.u)) + "</div>" +
    '<div class="track"><i style="width:' + Math.round(Math.min(1, r) * 100) + "%;background:var(--" + st[1] + ')"></i></div>' +
    '<div class="ctrl"><button class="step" data-a="dec" data-i="' + it.id + '" aria-label="Togli">−</button>' +
    '<input type="number" inputmode="decimal" min="0" step="any" value="' + h + '" data-a="set" data-i="' + it.id + '" aria-label="Quantità di ' + esc(it.n) + '">' +
    '<button class="step" data-a="inc" data-i="' + it.id + '" aria-label="Aggiungi">+</button>' +
    '<button class="pack" data-a="pack" data-i="' + it.id + '">+' + esc(fmt(it.pack, it.u)) + "</button>" +
    (m > 0 ? '<button class="max" data-a="max" data-i="' + it.id + '">Max</button>' : "") + "</div></div>";
}

function viewPantry() {
  const total = ITEMS.length;
  const ok = ITEMS.filter(function (x) { return missing(x.id) === 0; }).length;
  let h = '<section class="sum"><strong>Hai ' + ok + " ingredienti su " + total + ' per la settimana</strong><div class="bar2"><i style="width:' + Math.round(ok / total * 100) + '%"></i></div>';
  if (ok === 0 && Object.keys(state.pantry).length === 0) h += '<p class="tip">Parti da zero: segna quello che hai già in casa con + e −. Quando fai la spesa, tocca "Comprato" nella scheda Spesa.</p>';
  h += '<div class="filters" role="group" aria-label="Filtro">';
  [["tutti","Tutti"],["mancano","Mancano"],["ok","Ce li hai"]].forEach(function (f) {
    h += '<button class="fchip" data-a="filter" data-v="' + f[0] + '" aria-pressed="' + (ui.filter === f[0]) + '">' + f[1] + "</button>";
  });
  h += "</div></section>";
  WHERE.forEach(function (w) {
    const list = ITEMS.filter(function (x) {
      if (x.where !== w) return false;
      if (ui.filter === "mancano") return missing(x.id) > 0;
      if (ui.filter === "ok") return missing(x.id) === 0;
      return true;
    });
    if (!list.length) return;
    h += '<section class="group" data-w="' + w + '"><div class="gh"><h3>' + w + '</h3><span class="label">' + list.length + " voci</span></div>" + byCat(list).map(function (c) { return '<div class="cat">' + c[0] + "</div>" + c[1].map(pitem).join(""); }).join("") + "</section>";
  });
  return h;
}

function viewShop() {
  const miss = ITEMS.filter(function (x) { return missing(x.id) > 0; });
  if (!miss.length) return '<div class="empty">Hai tutto per la settimana. Niente da comprare.</div>';
  let h = '<section class="sum"><strong>Da comprare: ' + miss.length + " voci</strong><p class=\"tip\">Al mercato compri a peso, al discount a confezioni. \"Comprato\" aggiunge alla dispensa la quantità indicata.</p><div class=\"row1\" style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn small\" data-a=\"copy\">Copia la lista</button></div></section>";
  WHERE.forEach(function (w) {
    const list = miss.filter(function (x) { return x.where === w; });
    if (!list.length) return;
    h += '<section class="group" data-w="' + w + '"><div class="gh"><h3>' + w + '</h3><button class="btn ghost small" data-a="buyall" data-w="' + w + '">Tutto comprato</button></div>';
    byCat(list).forEach(function (c) { h += '<div class="cat">' + c[0] + "</div>"; c[1].forEach(function (it) {
      const b = buyQty(it), m = missing(it.id);
      h += '<div class="buyrow"><div><div class="nm">' + esc(it.n) + '</div><div class="meta">Compra ' + esc(fmt(b, it.u)) + (b !== m ? " (ti servono " + esc(fmt(m, it.u)) + ")" : "") + '</div></div><button class="btn ghost small" data-a="buy" data-i="' + it.id + '">Comprato</button></div>';
    }); });
    h += "</section>";
  });
  return h;
}

function render() {
  const tabs = [["settimana","Settimana"],["dispensa","Dispensa"],["spesa","Spesa"]];
  const mc = missingCount();
  document.getElementById("tabs").innerHTML = tabs.map(function (t) {
    return '<button class="tab" data-a="tab" data-t="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + (t[0] === "spesa" && mc > 0 ? '<span class="badge">' + mc + "</span>" : "") + "</button>";
  }).join("");
  const v = document.getElementById("view");
  v.innerHTML = ui.tab === "dispensa" ? viewPantry() : (ui.tab === "spesa" ? viewShop() : viewWeek());
  renderFoot();
}
function renderFoot() { document.getElementById("foot").textContent = Persist.status(); }

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
}

/* ---------- navigazione ---------- */
function applyHash() {
  const h = (location.hash || "").replace("#", "");
  if (h === "dispensa" || h === "spesa") ui.tab = h;
  else if (KEYS.indexOf(h) >= 0) { ui.tab = "settimana"; ui.day = h; }
  else if (h === "settimana") ui.tab = "settimana";
}
function go(tab, day) {
  ui.tab = tab;
  if (day) { if (day !== ui.day) ui.dish = null; ui.day = day; }
  try { location.hash = tab === "settimana" ? ui.day : tab; } catch (e) {}
  render();
}
window.addEventListener("hashchange", function () { applyHash(); render(); });

/* ---------- azioni ---------- */
function copyText(text) {
  const done = function () { toast("Lista copiata"); };
  const fallback = function () {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Non riesco a copiare"); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
function shopText() {
  let out = [];
  WHERE.forEach(function (w) {
    const list = ITEMS.filter(function (x) { return x.where === w && missing(x.id) > 0; });
    if (!list.length) return;
    out.push(w + ":");
    list.forEach(function (it) { out.push("- " + it.n + ": " + fmt(buyQty(it), it.u)); });
    out.push("");
  });
  return out.join("\n").trim();
}
function buy(it) {
  const p = {}; p[it.id] = Math.round((have(it.id) + buyQty(it)) * 100) / 100;
  return p;
}
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(function (res, rej) { c.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/jpeg", 0.82); });
}
async function addPhoto(fid, file) {
  if (!file || !assetsNS) return;
  toast("Carico la foto…");
  try {
    let blob;
    try { blob = await shrink(file); }
    catch (e) { blob = file; }
    const res = await assetsNS.upload(blob, { type: blob.type === "image/jpeg" ? "image/jpeg" : blob.type });
    const p = {}; p[fid] = res.id;
    commit({ photos: p });
    toast("Foto salvata");
  } catch (e) {
    toast("Non riesco a caricare la foto");
  }
}

document.addEventListener("toggle", function (e) {
  const d = e.target;
  if (d && d.classList && d.classList.contains("meal")) ui.open[d.dataset.key] = d.open;
}, true);

document.addEventListener("click", function (e) {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const a = t.dataset.a;
  if (a === "tab") { e.preventDefault(); go(t.dataset.t); window.scrollTo(0, 0); }
  else if (a === "day") go("settimana", t.dataset.k);
  else if (a === "cooked") markCooked(t.dataset.k, t.dataset.f);
  else if (a === "undo") undoCooked(t.dataset.key);
  else if (a === "dish") { ui.dish = t.dataset.f; render(); window.scrollTo(0, 0); }
  else if (a === "back") { ui.dish = null; render(); }
  else if (a === "max") { commit({ pantry: buy(IT[t.dataset.i]) }); }
  else if (a === "iemoji") { IC.e = t.dataset.v; applyIcon(true); }
  else if (a === "icolor") { IC.c = t.dataset.v; applyIcon(true); }
  else if (a === "filter") { ui.filter = t.dataset.v; render(); }
  else if (a === "inc" || a === "dec") {
    const it = IT[t.dataset.i];
    setHave(it.id, have(it.id) + (a === "inc" ? it.step : -it.step));
  }
  else if (a === "pack") { const it = IT[t.dataset.i]; setHave(it.id, have(it.id) + it.pack); }
  else if (a === "buy") { commit({ pantry: buy(IT[t.dataset.i]) }); toast("Aggiunto alla dispensa"); }
  else if (a === "buyall") {
    const p = {};
    ITEMS.filter(function (x) { return x.where === t.dataset.w && missing(x.id) > 0; }).forEach(function (it) { Object.assign(p, buy(it)); });
    commit({ pantry: p });
    toast("Aggiunto alla dispensa");
  }
  else if (a === "copy") copyText(shopText());
  else if (a === "unphoto") { const p = {}; p[t.dataset.f] = null; commit({ photos: p }); }
});
document.addEventListener("change", function (e) {
  const t = e.target;
  if (!t || !t.dataset) return;
  if (t.id === "emoin" && t.value.trim()) { IC.e = t.value.trim(); applyIcon(true); }
  else if (t.dataset.a === "set") setHave(t.dataset.i, t.value === "" ? 0 : t.value);
  else if (t.dataset.a === "photo") addPhoto(t.dataset.f, t.files && t.files[0]);
});

const IC = { e: "🍝", c: "C4492F" };
try { const p = new URLSearchParams(location.search), l = JSON.parse(localStorage.getItem("dp-icon") || "null"); if (l) { IC.e = l.e; IC.c = l.c; } if (p.get("i")) IC.e = p.get("i"); if (p.get("c")) IC.c = p.get("c"); } catch (e) {}
function applyIcon(save) {
  const cv = document.createElement("canvas"); cv.width = cv.height = 180;
  const x = cv.getContext("2d"); x.fillStyle = "#" + IC.c; x.fillRect(0, 0, 180, 180);

  l.href = cv.toDataURL("image/png");

  document.getElementById("emo").innerHTML = EMO.map(function (e) { return '<button class="fchip" data-a="iemoji" data-v="' + e + '" aria-pressed="' + (e === IC.e) + '">' + e + "</button>"; }).join("");
  document.getElementById("col").innerHTML = COLS.map(function (c) { return '<button class="fchip" data-a="icolor" data-v="' + c + '" aria-pressed="' + (c === IC.c) + '" aria-label="Colore" style="background:#' + c + ';width:44px"></button>'; }).join("");

const local = loadLocal();
if (local) { state = local; Persist.mode = "local"; }
applyHash();
render();

(async function connect() {
  if (!(window.claude && window.claude.use)) { if (Persist.mode === "pending") { Persist.mode = saveLocal() ? "local" : "memory"; renderFoot(); } return; }
  let db = null;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { if (Persist.mode === "pending") { Persist.mode = saveLocal() ? "local" : "memory"; } renderFoot(); return; }
  try { assetsNS = await window.claude.use("assets"); } catch (e) { assetsNS = null; }
  Persist.ref = db.doc("app/state");
  Persist.mode = "db";
  Persist.ref.onSnapshot(function (snap) {
    Persist.exists = snap.exists;
    if (Persist.patch || Persist.busy || snap.metadata.hasPendingWrites) { renderFoot(); return; }
    if (snap.exists) { state = normalize(snap.data()); saveLocal(); render(); }
    else if (local && (Object.keys(local.pantry).length || Object.keys(local.cooked).length)) {
      Persist.queue({ pantry: local.pantry, cooked: local.cooked, photos: local.photos });
      renderFoot();
    } else { render(); }
  }, function () { Persist.mode = local ? "local" : "memory"; renderFoot(); });
})();
})();
